name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repo (checkout, tests, HACS
# and hassfest validation). Declaring this at the top level silences GitHub's
# "workflow does not contain permissions" warning and drops the token's default
# write scopes.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # Pinned to 3.12 for now. Ideally this matches the Python our users run
    # (HA requires 3.14 since 2026.3), and 3.11+ is where GHSA-h3xj-44pw-qmj9
    # manifests — but moving the matrix to 3.14 pulls in the newest HA, which
    # turns several deprecated test-only calls (e.g. device_registry.async_get_device)
    # into hard errors and changes some registry behaviour the suite asserts on.
    # Production is unaffected (bus.py is already version-guarded, and the live
    # 2026.11 deployment works), so this is a test-suite modernization task, not a
    # user issue. On 3.12 `pip install homeassistant` resolves to the last HA that
    # supported it, where the suite is green. TODO: modernize the tests for the
    # newest HA, then move this back to "3.14". See _backlog_private.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Run test suite
        run: pytest tests/ -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

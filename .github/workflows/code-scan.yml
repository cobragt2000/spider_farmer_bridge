name: "Home Assistant Python Scan"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Runs once a week at 03:00 UTC on Sundays
    - cron: '0 3 * * 0'

permissions:
  contents: read

# Note: CodeQL is handled by GitHub's "default setup" (Settings -> Code security
# -> CodeQL analysis), so it is intentionally NOT duplicated here — an advanced
# (workflow) CodeQL run cannot upload while default setup is enabled.
# This workflow is the Ruff layer: real-bug + security linting (rules in ruff.toml).

jobs:
  ruff-lint:
    name: Ruff Linter & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff (rules configured in ruff.toml)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"

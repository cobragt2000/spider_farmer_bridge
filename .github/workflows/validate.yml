name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repo (checkout, tests, HACS
# and hassfest validation). Declaring this at the top level silences GitHub's
# "workflow does not contain permissions" warning and drops the token's default
# write scopes.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # 3.14 is what current HA requires (since 2026.3), so it tests the core our
    # users actually run: pip resolves the newest pytest-homeassistant-custom-component
    # and the HA release it pins. 3.12 resolves to the last HA that supported it
    # (2025.1), which keeps the conftest compat shims and the older-core code
    # paths (e.g. bus._dev_by_ident's async_get_device fallback) exercised.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Run test suite
        run: pytest tests/ -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

set_se_schedule:
  name: Set SE light schedule
  description: >-
    Write the full multi-period, weekday-aware schedule to a Spider Farmer
    SE-series light. Used by the Spider Light card; can also be called from
    automations.
  fields:
    entity_id:
      name: Light
      description: The SE light (or any of its entities) to write the schedule to.
      required: true
      selector:
        entity:
          integration: sf
          domain: light
    periods:
      name: Periods
      description: >-
        List of schedule periods. Each period is a mapping with keys: days
        (list of 0-6, 0=Sunday), start ("HH:MM"), end ("HH:MM"), brightness
        (11-100), fade (sunrise/sunset minutes, 0-30), enabled (0 or 1).
      required: true
      example: >-
        [{"enabled": 1, "days": [0, 1, 2, 3, 4, 5, 6], "start": "08:00",
        "end": "20:00", "brightness": 50, "fade": 15}]
      selector:
        object:

set_outlet_schedule:
  name: Set outlet Time Slot schedule
  description: >-
    Write an outlet's Time Slot schedule (up to 12 weekday-aware on/off slots)
    to a Spider Farmer power strip / display panel. Used by the tent card's
    Outlets tab; can also be called from automations.
  fields:
    entity_id:
      name: Outlet
      description: Any entity of the outlet to schedule (e.g. its switch or mode).
      required: true
      selector:
        entity:
          integration: sf
    periods:
      name: Slots
      description: >-
        List of up to 12 time slots. Each is a mapping with keys: days (list of
        0-6, 0=Sunday), start ("HH:MM"), end ("HH:MM").
      required: true
      example: >-
        [{"days": [1, 3, 5], "start": "08:00", "end": "20:00"}]

set_outlet_config:
  name: Set outlet mode + config
  description: >-
    Set an outlet's mode and its config fields (Cycle timings, device dropdown)
    in one atomic write, so picking a mode and configuring it commits together.
    Used by the tent card's Outlets tab.
  fields:
    entity_id:
      name: Outlet
      description: Any entity of the outlet (e.g. its switch or mode select).
      required: true
      selector:
        entity:
          integration: sf
    mode:
      name: Mode
      description: >-
        Outlet mode: Manual, Time Slot, Cycle, Temperature, Humidity, CO2.
      required: true
      example: Cycle
    config:
      name: Config
      description: >-
        Mapping of the mode's config subfields to values, e.g. for Cycle:
        {"cycle_start": "12:00", "cycle_run": 5, "cycle_off": 7, "cycle_times": 3}.
      required: false
      example: '{"cycle_run": 5, "cycle_off": 7, "cycle_times": 3}'
      selector:
        object:

set_alarm_settings:
  name: Set alarm thresholds
  description: >-
    Write the controller's alarm threshold settings (climate, substrate, and
    other-device alerts). Used by the tent card's Alerts tab; can also be
    called from automations.
  fields:
    entity_id:
      name: Controller
      description: Any entity of the controller whose alarms to set (e.g. its Alarm Settings sensor).
      required: true
      selector:
        entity:
          integration: sf
    settings:
      name: Settings
      description: >-
        The decoded threshold groups {climate, substrate, other}. Each metric
        is a mapping with key, enabled (0/1), and max/min (temps in °F).
      required: true
      selector:
        object:


apply_bundle:
  name: Apply settings bundle
  description: >-
    Commit several staged sub-settings to one device module (fan, blower,
    heater, humidifier, dehumidifier, light, light2) as a single
    block-preserving write. Used by the tent card's Save buttons; can also be
    called from automations.
  fields:
    entity_id:
      name: Device entity
      description: Any entity of the device to write to (e.g. its mode select).
      required: true
      selector:
        entity:
          integration: sf
    module:
      name: Module
      description: "The device module to write: fan, blower, heater, humidifier, dehumidifier, light, light2 (light_1/light_2 accepted)."
      required: true
      selector:
        text:
    settings:
      name: Settings
      description: >-
        Mapping of sub-setting keys to values, e.g. {"mode": "Cycle",
        "cycle_start": "08:00", "cycle_times": 4}.
      required: true
      selector:
        object:

set_card_option:
  name: Set card option
  description: >-
    Persist a per-panel card display option (e.g. the out-of-range colour mode)
    in the config entry so it survives upgrades and syncs across devices. Used
    by the tent card's Settings tab; not usually called by hand.
  fields:
    entity_id:
      name: Panel entity
      description: The panel's Alarm Settings sensor (identifies the controller).
      required: true
      selector:
        entity:
          integration: sf
    key:
      name: Key
      description: 'Option name, e.g. "colors".'
      required: true
      selector:
        text:
    value:
      name: Value
      description: 'Option value, e.g. "tile", "text", or "off".'
      required: true
      selector:
        text:

set_sensor_heating:
  name: Sensor cleaning (start/stop)
  description: >-
    Start or stop the air temp/humidity sensor self-clean heat cycle (the SF
    app's "Sensor cleaning"). Requires "Allow device control". Used by the tent
    card's Calibration tab.
  fields:
    entity_id:
      name: Controller entity
      description: Any Spider Farmer entity on the target controller.
      required: true
      selector:
        entity:
          integration: sf
    "on":
      name: Start
      description: On = start cleaning, Off = stop.
      required: true
      selector:
        boolean:

set_strip_sensor:
  name: Strip temperature source
  description: >-
    Choose the temperature/humidity source for an outlet-only power strip (AC5/
    AC10/S-Station): its own SF sensor, or a 3rd-party HA temp/humidity entity
    mirrored onto the strip for outlet automations. Used by the tent card's
    Settings tab.
  fields:
    entity_id:
      name: Strip entity
      description: Any Spider Farmer entity on the target strip.
      required: true
      selector:
        entity:
          integration: sf
    source:
      name: Source
      description: sf = the strip's own sensor; external = a 3rd-party HA sensor.
      required: true
      selector:
        select:
          translation_key: strip_sensor_source
          options:
            - sf
            - external
    temp_entity:
      name: External temperature entity
      description: HA temperature entity to mirror (when source = external).
      required: false
      selector:
        entity:
          domain: sensor
          device_class: temperature
    humi_entity:
      name: External humidity entity
      description: HA humidity entity to mirror (when source = external).
      required: false
      selector:
        entity:
          domain: sensor
          device_class: humidity

set_smart_control:
  name: Smart control (dehumidifier)
  description: >-
    Enable/disable and tune the integration's closed-loop humidity control for a
    device. WARNING: when enabled, the integration drives the dehumidifier gear
    (full Manual) and overrides SF's own automation. Used by the tent card's
    Settings tab.
  fields:
    entity_id:
      name: Device entity
      description: Any Spider Farmer entity on the target device.
      required: true
      selector:
        entity:
          integration: sf
    enabled:
      name: Enabled
      description: On = integration drives the dehumidifier; Off = hand control back.
      required: true
      selector:
        boolean:
    settings:
      name: Settings
      description: >-
        Tuning dict: humidity (entity_id), target, deadband, escalate_after_s,
        escalate_drop, ease_band, min_on_s, min_off_s.
      required: false
      selector:
        object:

set_outlet_env:
  name: Env outlet control (sensorless strip)
  description: >-
    Enable/disable integration-driven Temperature (Cooling/Heating) control for a
    single outlet on a strip that has no SF air sensor (AC5/AC10 on an external
    temp source). The outlet can't run this on the device, so the integration
    drives it from the mirrored temperature and the strip's env target. WARNING:
    when enabled, the integration owns that outlet (held in Manual on the device);
    the card still shows the chosen Temperature/Cooling mode. Used by the tent
    card's outlet popup on external strips.
  fields:
    entity_id:
      name: Outlet entity
      description: Any entity of the target outlet (its switch or mode select).
      required: true
      selector:
        entity:
          integration: sf
    enabled:
      name: Enabled
      description: On = integration drives the outlet; Off = hand control back to the device.
      required: true
      selector:
        boolean:
    mode:
      name: Mode
      description: Env mode to hold — Temperature or Humidity.
      required: false
      default: Temperature
      selector:
        select:
          options:
            - Temperature
            - Humidity
    direction:
      name: Direction
      description: >-
        Temperature: Cooling (on when warm) or Heating (on when cold).
        Humidity: Dehumidifying (on when humid) or Humidifying (on when dry).
      required: false
      default: Cooling
      selector:
        select:
          options:
            - Cooling
            - Heating
            - Humidifying
            - Dehumidifying
    settings:
      name: Settings
      description: "Optional tuning dict: deadband, min_on_s, min_off_s."
      required: false
      selector:
        object:

reboot_device:
  name: Reboot device
  description: >-
    Reboot a Spider Farmer controller via the bridge (the firmware's
    setDevRestart). The controller reconnects on its own once it's back up.
    Requires "Allow device control" to be enabled in the integration options;
    a controller that is offline is skipped.
  fields:
    entity_id:
      name: Device
      description: Any entity belonging to the controller you want to reboot.
      required: true
      selector:
        entity:
          integration: sf

# ── Time-lapse (v3.19.362: per-instance, keyed by tl_id) ─────────────────────
# Each camera's time-lapse is an independent instance identified by a slug (tl_id),
# normally driven from the Spider Time-lapse card. Omit tl_id to target the first
# instance (back-compat).
timelapse_configure:
  name: Time-lapse configure
  description: >-
    Create or update one time-lapse instance. Supply tl_id (a slug) or let it be
    derived from name/camera; a new tl_id creates a new time-lapse. Storage must be
    a secure, non-web-served folder (never under /www or /config/www).
  fields:
    tl_id:
      name: Instance id
      description: Stable slug for this time-lapse. New id = new instance.
      required: false
      selector:
        text:
    name:
      name: Name
      description: Instance name (drives the tl_id slug). Defaults from the camera when blank.
      required: false
      selector:
        text:
    label:
      name: Display name
      description: >-
        Optional header title shown on the card. Leave blank to fall back to the
        camera's friendly name. Does not change the tl_id.
      required: false
      selector:
        text:
    camera:
      name: Camera
      required: false
      selector:
        entity:
          domain: camera
    storage_dir:
      name: Storage folder
      description: Secure absolute path (never /www or /config/www).
      required: false
      selector:
        text:
    interval:
      name: Interval (s)
      required: false
      selector:
        number: { min: 5, max: 3600, step: 5, unit_of_measurement: s, mode: box }
    retention:
      name: Keep (days)
      required: false
      selector:
        number: { min: 1, max: 365, step: 1, unit_of_measurement: d, mode: box }
    enabled:
      name: Enable capture
      required: false
      selector:
        boolean:
    overlay:
      name: Env overlay
      required: false
      selector:
        boolean:
    overlay_burn:
      name: Burn overlay into video
      required: false
      selector:
        boolean:
    overlay_panel:
      name: Read env from panel
      required: false
      selector:
        text:
    overlay_fields:
      name: Overlay fields
      description: "Any of: temp, humidity, vpd, co2, ppfd, timestamp, day."
      required: false
      selector:
        object:
    overlay_color:
      name: Overlay text colour
      description: Hex colour, e.g. "#ffffff".
      required: false
      selector:
        text:
    overlay_grouped:
      name: Overlay grouped
      description: All readings in one box (selection order) vs. placed per field.
      required: false
      selector:
        boolean:
    overlay_orient:
      name: Overlay layout
      description: '"v" (stacked) or "h" (one row) for the grouped box.'
      required: false
      selector:
        text:
    overlay_labels:
      name: Overlay labels
      description: Off shows just values (e.g. 72°F) without the Temp/RH labels.
      required: false
      selector:
        boolean:
    overlay_font:
      name: Overlay text size
      description: Overlay text size in px as shown on the card (default 12).
      required: false
      selector:
        number:
          min: 5
          max: 20
          step: 1
          mode: box
    overlay_pos:
      name: Overlay positions
      description: '{field|"group": [xPct, yPct]} anchor positions.'
      required: false
      selector:
        object:
    align:
      name: Start on the mark
      description: On = first frame on the next clock mark; off = start immediately.
      required: false
      selector:
        boolean:
    daily_at:
      name: Capture daily at
      description: '"HH:MM" time-of-day for a 1-day interval.'
      required: false
      selector:
        text:

timelapse_start:
  name: Time-lapse start
  description: Begin or resume capture for one instance.
  fields:
    tl_id:
      name: Instance id
      required: false
      selector:
        text:
    interval:
      name: Interval (s)
      required: false
      selector:
        number: { min: 5, max: 3600, step: 5, unit_of_measurement: s, mode: box }

timelapse_stop:
  name: Time-lapse stop
  description: Stop capture for one instance (does not resume after a reboot).
  fields:
    tl_id:
      name: Instance id
      required: false
      selector:
        text:

timelapse_set_interval:
  name: Time-lapse set interval
  description: Change the capture interval for one instance (while capturing).
  fields:
    tl_id:
      name: Instance id
      required: false
      selector:
        text:
    interval:
      name: Interval (s)
      required: true
      selector:
        number: { min: 5, max: 3600, step: 5, unit_of_measurement: s, mode: box }

timelapse_export:
  name: Time-lapse export MP4
  description: Render a session's frames to an .mp4 in the same secure folder.
  fields:
    tl_id:
      name: Instance id
      required: false
      selector:
        text:
    session:
      name: Session
      required: false
      selector:
        text:
    fps:
      name: Frames per second
      required: false
      selector:
        number: { min: 1, max: 60, step: 1, mode: box }
    name:
      name: Output file name
      required: false
      selector:
        text:

timelapse_remove:
  name: Time-lapse remove
  description: >-
    Delete one time-lapse instance (stops capture, drops its status sensor). With
    delete_images on, its captured frames/sessions/exports folder is deleted too.
  fields:
    tl_id:
      name: Instance id
      required: true
      selector:
        text:
    delete_images:
      name: Delete images
      description: Also delete the captured frames/sessions/exports on disk.
      required: false
      selector:
        boolean:

timelapse_clear:
  name: Time-lapse clear images
  description: >-
    Delete ALL captured images, sessions and exported videos for one time-lapse
    instance (keeps the instance itself). If it was capturing, it continues into a
    fresh, empty session. This cannot be undone.
  fields:
    tl_id:
      name: Instance id
      required: false
      selector:
        text:

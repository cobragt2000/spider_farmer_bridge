name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: every job here only reads the repo (checkout, tests, HACS
# and hassfest validation). Declaring this at the top level silences GitHub's
# "workflow does not contain permissions" warning and drops the token's default
# write scopes.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # Run the suite on the Python version our users actually run, so
    # version-specific behaviour (e.g. GHSA-h3xj-44pw-qmj9, which only manifests
    # on 3.11+, where asyncio.TimeoutError became the builtin TimeoutError) is
    # caught in CI before release instead of in someone's Home Assistant. Home
    # Assistant has required Python 3.14 since 2026.3 (older 3.13 is dropped, and
    # current HA won't even install on it) — keep this list aligned with HA's
    # required Python as it moves. fail-fast is off so added versions report
    # independently.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Run test suite
        run: pytest tests/ -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

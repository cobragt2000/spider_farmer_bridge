blueprint:
  name: Spider Farmer - Grow Alerts
  description: >
    One blueprint for every common grow alert. Turn on only the checks you
    want by setting a threshold — anything left at its default is OFF and never
    fires. Covers air Temperature, Humidity and VPD (high & low, with optional
    separate day / night limits that switch on a lights-on sensor), Soil moisture,
    temperature and EC (high & low) across any number of probes, "device can't
    keep up" for the humidifier / dehumidifier / heater, third-party water-leak
    sensors (any brand), and a relay of the controller's own alarms (tank full,
    tank empty, device offline, light-temp, faults). Each alert waits a
    sustained time before firing (no flapping), can repeat on an interval while
    still out of range, and notifies by any mix of: a persistent notification,
    your phone (mobile app), a spoken announcement (TTS on a media player), plus
    any extra actions you drop in. Defaults target the dp1 display panel; change
    the sensors to use another panel (ac5, etc.) or your own sensors.
  domain: automation
  source_url: https://github.com/cobragt2000/spider_farmer_bridge
  input:
    general:
      name: General
      icon: mdi:sprout
      input:
        tent_name:
          name: Tent / zone name
          description: Shown in the alert title and message.
          default: Grow Tent
          selector:
            text: {}
        sustain_for:
          name: Must stay out of range for
          description: >
            How long a reading must stay past the threshold before it alerts
            (minutes and seconds). Stops brief spikes (a door opening, a mister
            pulse) from alerting.
          default:
            hours: 0
            minutes: 3
            seconds: 0
          selector:
            duration: {}
        renotify_after:
          name: Re-notify every (0 = once)
          description: >
            While a reading is still out of range, send the alert again this
            often (minutes and seconds). Leave at 0 to alert only once each time
            it crosses.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}
        day_sensor:
          name: Day / lights-on sensor (optional)
          description: >
            A sensor that is ON during the day / lights-on (e.g.
            binary_sensor.sf_<panel>_daytime_schedule, or a grow-light switch).
            When set, the air metrics below use their DAY thresholds while it's on
            and their NIGHT thresholds while it's off. Leave empty to use the day
            thresholds around the clock.
          default: ""
          selector:
            entity: {}
        settle_after_flip:
          name: Settle time after day↔night change
          description: >
            After the day/lights-on sensor flips, pause the air (temp/RH/VPD)
            alerts for this long so the tent can stabilize — prevents a false
            "too hot at night" the moment the lights go off while the temperature
            is still coming down. Alerts fire on CROSSINGS, so this is usually a
            light safety margin. Ignored when no day sensor is set.
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration: {}

    air_temperature:
      name: Air temperature
      icon: mdi:thermometer
      collapsed: true
      input:
        temp_sensor:
          name: Temperature sensor
          description: Your tent's air-temperature sensor (e.g. sensor.sf_<panel>_temperature).
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        temp_high:
          name: Day — alert when temp rises ABOVE
          description: >
            Daytime / lights-on high (also used around the clock when no day
            sensor is set). Leave at 999 to disable. Example lights-on 83.
          default: 999
          selector:
            number: { min: -50, max: 999, step: 0.5, mode: box, unit_of_measurement: "°" }
        temp_low:
          name: Day — alert when temp drops BELOW
          description: Daytime low. Leave at -999 to disable. Example 60.
          default: -999
          selector:
            number: { min: -999, max: 150, step: 0.5, mode: box, unit_of_measurement: "°" }
        temp_night_high:
          name: Night — alert when temp rises ABOVE
          description: >
            Used while the day sensor is OFF. Leave at 999 to skip the night high
            alert. Example lights-off 78.
          default: 999
          selector:
            number: { min: -50, max: 999, step: 0.5, mode: box, unit_of_measurement: "°" }
        temp_night_low:
          name: Night — alert when temp drops BELOW
          description: Used while the day sensor is OFF. Leave at -999 to skip. Example 62.
          default: -999
          selector:
            number: { min: -999, max: 150, step: 0.5, mode: box, unit_of_measurement: "°" }

    humidity:
      name: Humidity (RH)
      icon: mdi:water-percent
      collapsed: true
      input:
        humidity_sensor:
          name: Humidity sensor
          description: Your tent's RH sensor (e.g. sensor.sf_<panel>_humidity).
          selector:
            entity:
              filter:
                domain: sensor
                device_class: humidity
        hum_high:
          name: Day — alert when RH rises ABOVE (%)
          description: >
            Daytime / lights-on high (also used around the clock when no day
            sensor is set). Leave at 999 to disable. Example 65.
          default: 999
          selector:
            number: { min: 0, max: 999, step: 1, mode: box, unit_of_measurement: "%" }
        hum_low:
          name: Day — alert when RH drops BELOW (%)
          description: Daytime low. Leave at -999 to disable. Example 40.
          default: -999
          selector:
            number: { min: -999, max: 100, step: 1, mode: box, unit_of_measurement: "%" }
        hum_night_high:
          name: Night — alert when RH rises ABOVE (%)
          description: Used while the day sensor is OFF. Leave at 999 to skip. Example 70.
          default: 999
          selector:
            number: { min: 0, max: 999, step: 1, mode: box, unit_of_measurement: "%" }
        hum_night_low:
          name: Night — alert when RH drops BELOW (%)
          description: Used while the day sensor is OFF. Leave at -999 to skip. Example 45.
          default: -999
          selector:
            number: { min: -999, max: 100, step: 1, mode: box, unit_of_measurement: "%" }

    vpd:
      name: VPD
      icon: mdi:water-opacity
      collapsed: true
      input:
        vpd_sensor:
          name: VPD sensor
          description: Your tent's VPD sensor (e.g. sensor.sf_<panel>_vpd).
          selector:
            entity:
              filter:
                domain: sensor
        vpd_high:
          name: Day — alert when VPD rises ABOVE (kPa)
          description: >
            Daytime / lights-on high (also used around the clock when no day
            sensor is set). Leave at 999 to disable. Example 1.6.
          default: 999
          selector:
            number: { min: 0, max: 999, step: 0.05, mode: box, unit_of_measurement: kPa }
        vpd_low:
          name: Day — alert when VPD drops BELOW (kPa)
          description: Daytime low. Leave at -999 to disable. Example 1.1.
          default: -999
          selector:
            number: { min: -999, max: 10, step: 0.05, mode: box, unit_of_measurement: kPa }
        vpd_night_high:
          name: Night — alert when VPD rises ABOVE (kPa)
          description: Used while the day sensor is OFF. Leave at 999 to skip. Example 1.4.
          default: 999
          selector:
            number: { min: 0, max: 999, step: 0.05, mode: box, unit_of_measurement: kPa }
        vpd_night_low:
          name: Night — alert when VPD drops BELOW (kPa)
          description: Used while the day sensor is OFF. Leave at -999 to skip. Example 0.9.
          default: -999
          selector:
            number: { min: -999, max: 10, step: 0.05, mode: box, unit_of_measurement: kPa }

    soil:
      name: Soil probes
      icon: mdi:watering-can
      collapsed: true
      input:
        soil_moisture_sensors:
          name: Soil moisture sensors
          description: >
            Pick every moisture probe for this zone — add as many as you have. One
            shared low/high threshold is checked against each, and the alert names
            whichever probe crossed.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
        soil_moisture_low:
          name: Alert when any probe moisture drops BELOW (%)
          description: Dry alert. Leave at -999 to disable. Example 30.
          default: -999
          selector:
            number: { min: -999, max: 100, step: 1, mode: box, unit_of_measurement: "%" }
        soil_moisture_high:
          name: Alert when any probe moisture rises ABOVE (%)
          description: Over-watered alert. Leave at 999 to disable. Example 85.
          default: 999
          selector:
            number: { min: 0, max: 999, step: 1, mode: box, unit_of_measurement: "%" }
        soil_temp_sensors:
          name: Soil temperature sensors
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
        soil_temp_high:
          name: Alert when any probe soil temp rises ABOVE
          description: Leave at 999 to disable.
          default: 999
          selector:
            number: { min: -50, max: 999, step: 0.5, mode: box, unit_of_measurement: "°" }
        soil_temp_low:
          name: Alert when any probe soil temp drops BELOW
          description: Leave at -999 to disable.
          default: -999
          selector:
            number: { min: -999, max: 150, step: 0.5, mode: box, unit_of_measurement: "°" }
        soil_ec_sensors:
          name: Soil EC sensors
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
        soil_ec_high:
          name: Alert when any probe EC rises ABOVE
          description: Over-fed / salt build-up. Leave at 9999 to disable.
          default: 9999
          selector:
            number: { min: 0, max: 9999, step: 1, mode: box }
        soil_ec_low:
          name: Alert when any probe EC drops BELOW
          description: Under-fed. Leave at -999 to disable.
          default: -999
          selector:
            number: { min: -999, max: 9999, step: 1, mode: box }

    device_cant_keep_up:
      name: Device can't keep up
      icon: mdi:fan-alert
      collapsed: true
      input:
        device_runtime_minutes:
          name: Running continuously for (minutes)
          description: >
            If a device runs this long AND its metric is STILL out of range
            (using the Humidity / Temperature thresholds above), alert that it
            can't keep up — undersized, blocked, or an empty water tank. Set the
            matching Humidity-low / Humidity-high / Temperature-low threshold for
            these to work.
          default: 45
          selector:
            number: { min: 1, max: 600, step: 1, mode: box, unit_of_measurement: min }
        humidifier_switch:
          name: Humidifier switch
          description: Leave empty if you have none.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: switch
        dehumidifier_switch:
          name: Dehumidifier switch
          description: Leave empty if you have none.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: switch
        heater_switch:
          name: Heater switch
          description: Leave empty if you have none.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: switch

    water_leak:
      name: Water leak sensors
      icon: mdi:water-alert
      collapsed: true
      input:
        water_sensors:
          name: Leak / water sensors
          description: >
            Any wet/leak binary sensors — any brand (Sonoff, Aqara, etc.), not just
            Spider Farmer. Alerts the moment one reports wet (and re-nags while it
            stays wet if re-notify is set). Leave empty if you have none.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class: moisture
                - domain: binary_sensor
                  device_class: water

    controller_alarms:
      name: Controller & device alarms
      icon: mdi:alert-decagram
      collapsed: true
      input:
        alarms_sensors:
          name: Controller alarm log sensor(s)
          description: >
            Your panel's sf_<panel>_alarms sensor (add one per tent/panel). Relays
            any alarm the Spider Farmer controller raises — dehumidifier tank full,
            humidifier tank empty, a device going offline, light temperature too
            high, heater faults, and so on — naming the device and the condition.
            Leave empty to turn the relay off.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: sensor
        alarm_scope:
          name: Which controller alarms to relay
          description: >
            Tick what to forward. Use a preset — "Faults only" (everything except
            plain above/below threshold) or "All" — and/or tick individual types.
            Default is Faults only; add "Above / below threshold" (or All) to also
            relay the controller's own threshold alarms (your sensor thresholds
            above may already cover those).
          default:
            - Faults only (tank, offline, light-temp, etc.)
          selector:
            select:
              multiple: true
              options:
                - All (every alarm type)
                - Faults only (tank, offline, light-temp, etc.)
                - Tank / water (full or empty)
                - Device offline
                - Light temperature too high
                - Above / below threshold
                - Other faults
        alarm_include_clears:
          name: Also notify when an alarm clears (returns to normal)
          default: false
          selector:
            boolean: {}

    notifications:
      name: How to notify
      icon: mdi:bell-ring
      input:
        enable_persistent:
          name: Persistent notification (in Home Assistant)
          default: true
          selector:
            boolean: {}
        mobile_notify_device:
          name: Phone to notify
          description: >
            Pick the phone / tablet running the Home Assistant Companion app.
            Leave empty to skip phone alerts. (Add more phones in Extra actions.)
          default: ""
          selector:
            device:
              integration: mobile_app
        voice_enable:
          name: Speak the alert (TTS)
          default: false
          selector:
            boolean: {}
        voice_tts_entity:
          name: TTS engine (for voice)
          description: e.g. tts.google_translate_en_com or tts.piper.
          default: ""
          selector:
            entity:
              filter:
                domain: tts
        voice_media_player:
          name: Speaker / media player (for voice)
          default: ""
          selector:
            entity:
              filter:
                domain: media_player
        extra_actions:
          name: Extra actions (optional)
          description: >
            Anything else to run on every alert — a second phone, Alexa, a light,
            a siren, a webhook. The alert title/message are available as
            {{ alert_title }} and {{ alert_message }}.
          default: []
          selector:
            action: {}

mode: parallel
max: 30
max_exceeded: silent

variables:
  tent_name: !input tent_name
  temp_sensor: !input temp_sensor
  humidity_sensor: !input humidity_sensor
  temp_high: !input temp_high
  temp_low: !input temp_low
  hum_high: !input hum_high
  hum_low: !input hum_low
  vpd_high: !input vpd_high
  vpd_low: !input vpd_low
  soil_moisture_high: !input soil_moisture_high
  soil_moisture_low: !input soil_moisture_low
  soil_temp_high: !input soil_temp_high
  soil_temp_low: !input soil_temp_low
  soil_ec_high: !input soil_ec_high
  soil_ec_low: !input soil_ec_low
  renotify_after: !input renotify_after
  renotify_secs: >-
    {{ (renotify_after.days | int(0)) * 86400 + (renotify_after.hours | int(0)) * 3600
       + (renotify_after.minutes | int(0)) * 60 + (renotify_after.seconds | int(0)) }}
  enable_persistent: !input enable_persistent
  mobile_notify_device: !input mobile_notify_device
  # Build the phone's notify service from the picked device:
  # notify.mobile_app_<slugified device name> (verified to match the services HA
  # creates for each Companion-app device). Empty when no phone is picked.
  mobile_service: >-
    {% if (mobile_notify_device | default('')) %}notify.mobile_app_{{ device_attr(mobile_notify_device, 'name') | slugify }}{% endif %}
  voice_enable: !input voice_enable
  voice_tts_entity: !input voice_tts_entity
  voice_media_player: !input voice_media_player
  alarm_scope: !input alarm_scope
  alarm_include_clears: !input alarm_include_clears
  day_sensor: !input day_sensor
  settle_after_flip: !input settle_after_flip
  temp_night_high: !input temp_night_high
  temp_night_low: !input temp_night_low
  hum_night_high: !input hum_night_high
  hum_night_low: !input hum_night_low
  vpd_night_high: !input vpd_night_high
  vpd_night_low: !input vpd_night_low
  # Day/night regime (air metrics). No day sensor => always "day" (day thresholds
  # apply around the clock; night entries never fire). `settled` suppresses air
  # alerts for a bit after the lights flip so the tent can stabilize.
  has_day_sensor: "{{ (day_sensor | default('') | trim) | length > 0 }}"
  is_day: "{{ (not (has_day_sensor | bool)) or is_state(day_sensor, 'on') }}"
  settle_secs: >-
    {{ (settle_after_flip.hours | int(0)) * 3600 + (settle_after_flip.minutes | int(0)) * 60
       + (settle_after_flip.seconds | int(0)) }}
  settled: >-
    {% if not (has_day_sensor | bool) %}true{% else %}{% set lc = states[day_sensor].last_changed if states[day_sensor] is not none else none %}{{ (lc is none) or ((as_timestamp(now()) - as_timestamp(lc)) >= (settle_secs | int(0))) }}{% endif %}
  # Per-trigger metadata. `kind` picks how the alert is evaluated/worded:
  #   numeric = compare the crossing entity to a threshold (reads trigger.entity_id,
  #             so one soil/leak entry covers every picked sensor)
  #   state   = alert while a binary/enum entity sits on a "bad" value (leak = on)
  #   alarm   = relay the controller's own alarm log (device + condition text)
  meta:
    temp_high:        { label: "Temperature high (day)",   dir: above, thr: "{{ temp_high }}",       regime: day }
    temp_low:         { label: "Temperature low (day)",    dir: below, thr: "{{ temp_low }}",        regime: day }
    temp_high_night:  { label: "Temperature high (night)", dir: above, thr: "{{ temp_night_high }}", regime: night }
    temp_low_night:   { label: "Temperature low (night)",  dir: below, thr: "{{ temp_night_low }}",  regime: night }
    hum_high:         { label: "Humidity high (day)",      dir: above, thr: "{{ hum_high }}",        regime: day }
    hum_low:          { label: "Humidity low (day)",       dir: below, thr: "{{ hum_low }}",         regime: day }
    hum_high_night:   { label: "Humidity high (night)",    dir: above, thr: "{{ hum_night_high }}",  regime: night }
    hum_low_night:    { label: "Humidity low (night)",     dir: below, thr: "{{ hum_night_low }}",   regime: night }
    vpd_high:         { label: "VPD high (day)",           dir: above, thr: "{{ vpd_high }}",        regime: day }
    vpd_low:          { label: "VPD low (day)",            dir: below, thr: "{{ vpd_low }}",         regime: day }
    vpd_high_night:   { label: "VPD high (night)",         dir: above, thr: "{{ vpd_night_high }}",  regime: night }
    vpd_low_night:    { label: "VPD low (night)",          dir: below, thr: "{{ vpd_night_low }}",   regime: night }
    soilm_low:   { label: "Soil moisture low (dry)",     dir: below, thr: "{{ soil_moisture_low }}" }
    soilm_high:  { label: "Soil moisture high (wet)",    dir: above, thr: "{{ soil_moisture_high }}" }
    soilt_high:  { label: "Soil temperature high",       dir: above, thr: "{{ soil_temp_high }}" }
    soilt_low:   { label: "Soil temperature low",        dir: below, thr: "{{ soil_temp_low }}" }
    soilec_high: { label: "Soil EC high",                dir: above, thr: "{{ soil_ec_high }}" }
    soilec_low:  { label: "Soil EC low",                 dir: below, thr: "{{ soil_ec_low }}" }
    humidifier_stuck:   { label: "Humidifier can't keep up (RH still low)",  entity: "{{ humidity_sensor }}", dir: below, thr: "{{ hum_low }}" }
    dehumidifier_stuck: { label: "Dehumidifier can't keep up (RH still high)", entity: "{{ humidity_sensor }}", dir: above, thr: "{{ hum_high }}" }
    heater_stuck:       { label: "Heater can't keep up (temp still low)",     entity: "{{ temp_sensor }}",     dir: below, thr: "{{ temp_low }}" }
    water_leak:         { kind: state, label: "Water leak detected", bad: "on" }
    controller_alarm:   { kind: alarm, label: "Controller alarm" }
  info: "{{ meta[trigger.id] }}"
  a_kind: "{{ info.kind | default('numeric') }}"
  a_regime: "{{ info.regime | default('any') }}"
  a_label: "{{ info.label }}"
  a_entity: "{{ info.entity | default(trigger.entity_id, true) }}"
  a_dir: "{{ info.dir | default('') }}"
  a_thr: "{{ info.thr | default('') }}"
  a_bad: "{{ info.bad | default('') }}"
  a_name: "{{ state_attr(a_entity, 'friendly_name') or a_entity }}"
  cur: "{{ states(a_entity) }}"
  cur_unit: "{{ state_attr(a_entity, 'unit_of_measurement') or '' }}"
  # Is this metric's regime active right now? Air metrics are day/night; everything
  # else is 'any' (always active). During the post-flip settle window, air is paused.
  regime_ok: >-
    {% if a_regime == 'day' %}{{ (is_day | bool) and (settled | bool) }}{% elif a_regime == 'night' %}{{ (has_day_sensor | bool) and (not (is_day | bool)) and (settled | bool) }}{% else %}true{% endif %}
  # Controller-alarm fields (only meaningful when a_kind == 'alarm').
  alarm_ev: "{{ (state_attr(a_entity, 'events') or [{}])[0] if a_kind == 'alarm' else {} }}"
  alarm_device: "{{ alarm_ev.device | default('Device') }}"
  alarm_text: "{{ alarm_ev.alarm | default('alarm') }}"
  alarm_cleared: "{{ (alarm_ev.alarmType is none) or ('restoring' in (alarm_text | lower)) }}"
  # Does the selected set of alarm types include this event? Matches the
  # controller's own wording against the categories the user ticked.
  alarm_allowed: >-
    {% set txt = alarm_text | lower %}
    {% set sel = alarm_scope if (alarm_scope is sequence and alarm_scope is not string) else [alarm_scope] %}
    {% set is_tank = ('tank' in txt or 'water' in txt) %}
    {% set is_offline = ('offline' in txt) %}
    {% set is_lt = ('light temp' in txt) %}
    {% set is_thresh = ('threshold' in txt) %}
    {% set is_other = not (is_tank or is_offline or is_lt or is_thresh) %}
    {% set ns = namespace(ok=false) %}
    {% if 'All (every alarm type)' in sel %}{% set ns.ok = true %}{% endif %}
    {% if ('Faults only (tank, offline, light-temp, etc.)' in sel) and (not is_thresh) %}{% set ns.ok = true %}{% endif %}
    {% if is_tank and ('Tank / water (full or empty)' in sel) %}{% set ns.ok = true %}{% endif %}
    {% if is_offline and ('Device offline' in sel) %}{% set ns.ok = true %}{% endif %}
    {% if is_lt and ('Light temperature too high' in sel) %}{% set ns.ok = true %}{% endif %}
    {% if is_thresh and ('Above / below threshold' in sel) %}{% set ns.ok = true %}{% endif %}
    {% if is_other and ('Other faults' in sel) %}{% set ns.ok = true %}{% endif %}
    {{ ns.ok }}
  alert_title: >-
    {% if a_kind == 'alarm' %}{{ tent_name }} alarm — {{ alarm_device }}{% else %}{{ tent_name }} alert — {{ a_label }}{% endif %}
  alert_message: >-
    {% if a_kind == 'alarm' %}{{ alarm_device }}: {{ alarm_text }}{% elif a_kind == 'state' %}{{ a_label }} on {{ a_name }}{% else %}{{ a_label }} on {{ a_name }}: now {{ cur }}{{ cur_unit }} (alerts when {{ a_dir }} {{ a_thr }}{{ cur_unit }}){% endif %}
  notif_id: >-
    sf_grow_alert_{{ trigger.id }}_{{ (a_entity ~ (('_' ~ alarm_device) if a_kind == 'alarm' else '')) | replace('.', '_') | replace(' ', '_') }}

triggers:
  - { trigger: numeric_state, id: temp_high,   entity_id: !input temp_sensor,            above: !input temp_high,          for: !input sustain_for }
  - { trigger: numeric_state, id: temp_low,    entity_id: !input temp_sensor,            below: !input temp_low,           for: !input sustain_for }
  - { trigger: numeric_state, id: hum_high,    entity_id: !input humidity_sensor,        above: !input hum_high,           for: !input sustain_for }
  - { trigger: numeric_state, id: hum_low,     entity_id: !input humidity_sensor,        below: !input hum_low,            for: !input sustain_for }
  - { trigger: numeric_state, id: vpd_high,    entity_id: !input vpd_sensor,             above: !input vpd_high,           for: !input sustain_for }
  - { trigger: numeric_state, id: vpd_low,     entity_id: !input vpd_sensor,             below: !input vpd_low,            for: !input sustain_for }
  - { trigger: numeric_state, id: temp_high_night, entity_id: !input temp_sensor,        above: !input temp_night_high,    for: !input sustain_for }
  - { trigger: numeric_state, id: temp_low_night,  entity_id: !input temp_sensor,        below: !input temp_night_low,     for: !input sustain_for }
  - { trigger: numeric_state, id: hum_high_night,  entity_id: !input humidity_sensor,    above: !input hum_night_high,     for: !input sustain_for }
  - { trigger: numeric_state, id: hum_low_night,   entity_id: !input humidity_sensor,    below: !input hum_night_low,      for: !input sustain_for }
  - { trigger: numeric_state, id: vpd_high_night,  entity_id: !input vpd_sensor,         above: !input vpd_night_high,     for: !input sustain_for }
  - { trigger: numeric_state, id: vpd_low_night,   entity_id: !input vpd_sensor,         below: !input vpd_night_low,      for: !input sustain_for }
  - { trigger: numeric_state, id: soilm_low,   entity_id: !input soil_moisture_sensors,  below: !input soil_moisture_low,  for: !input sustain_for }
  - { trigger: numeric_state, id: soilm_high,  entity_id: !input soil_moisture_sensors,  above: !input soil_moisture_high, for: !input sustain_for }
  - { trigger: numeric_state, id: soilt_high,  entity_id: !input soil_temp_sensors,      above: !input soil_temp_high,     for: !input sustain_for }
  - { trigger: numeric_state, id: soilt_low,   entity_id: !input soil_temp_sensors,      below: !input soil_temp_low,      for: !input sustain_for }
  - { trigger: numeric_state, id: soilec_high, entity_id: !input soil_ec_sensors,        above: !input soil_ec_high,       for: !input sustain_for }
  - { trigger: numeric_state, id: soilec_low,  entity_id: !input soil_ec_sensors,        below: !input soil_ec_low,        for: !input sustain_for }
  - { trigger: state, id: humidifier_stuck,    entity_id: !input humidifier_switch,      to: "on", for: { minutes: !input device_runtime_minutes } }
  - { trigger: state, id: dehumidifier_stuck,  entity_id: !input dehumidifier_switch,    to: "on", for: { minutes: !input device_runtime_minutes } }
  - { trigger: state, id: heater_stuck,        entity_id: !input heater_switch,          to: "on", for: { minutes: !input device_runtime_minutes } }
  - { trigger: state, id: water_leak,          entity_id: !input water_sensors,          to: "on" }
  - { trigger: state, id: controller_alarm,    entity_id: !input alarms_sensors }

conditions: []

actions:
  - alias: Alert while the reading is still out of range (repeats if re-notify set)
    repeat:
      while:
        - condition: template
          value_template: >-
            {% if a_kind == 'alarm' %}{{ (alarm_include_clears or not alarm_cleared) and (alarm_allowed | bool) }}{% elif a_kind == 'state' %}{{ states(a_entity) == a_bad }}{% else %}{% set v = states(a_entity) | float(none) %}{{ v is not none and (regime_ok | bool) and ((a_dir == 'above' and v > (a_thr | float(999999))) or (a_dir == 'below' and v < (a_thr | float(-999999)))) }}{% endif %}
      sequence:
        - alias: Persistent notification
          if: "{{ enable_persistent }}"
          then:
            - action: persistent_notification.create
              data:
                notification_id: "{{ notif_id }}"
                title: "{{ alert_title }}"
                message: "{{ alert_message }}"
        - alias: Mobile app notification
          if: "{{ (mobile_service | default('') | trim) | length > 0 }}"
          then:
            - action: "{{ mobile_service }}"
              data:
                title: "{{ alert_title }}"
                message: "{{ alert_message }}"
                data:
                  importance: high
                  priority: high
                  ttl: 0
                  car_ui: true
        - alias: Spoken announcement
          if: >-
            {{ voice_enable
               and (voice_tts_entity | default('') | length > 0)
               and (voice_media_player | default('') | length > 0) }}
          then:
            - action: tts.speak
              target:
                entity_id: "{{ voice_tts_entity }}"
              data:
                media_player_entity_id: "{{ voice_media_player }}"
                message: "{{ alert_message }}"
        - alias: Extra user actions
          choose: []
          default: !input extra_actions
        - alias: Stop here if not re-notifying (always one-shot for controller alarms)
          if: "{{ a_kind == 'alarm' or (renotify_secs | int(0)) <= 0 }}"
          then:
            - stop: One-shot alert sent
          else:
            - delay: !input renotify_after

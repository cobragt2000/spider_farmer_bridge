name: Release

on:
  release:
    types: [published]
  # Manual fallback: run against any existing tag from the Actions tab
  # (e.g. if a release was published before this workflow existed).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach sf.zip to (e.g. v3.19.40)"
        required: true

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # HACS extracts this zip into custom_components/sf, so the
      # integration files must sit at the zip root (no nested folders).
      - name: Build sf.zip
        run: |
          cd custom_components/sf
          zip -r ../../sf.zip .

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: sf.zip
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
